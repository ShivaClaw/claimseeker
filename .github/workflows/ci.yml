name: ci

# One job, the same command a person runs locally. If this file and scripts/Verify.ps1 ever
# disagree about what "verified" means, the script is right.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The engine ships for Windows and macOS. Both images carry a Chromium-family browser,
        # which PortalHarness drives against a page served from the runner itself.
        os: [windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Locked restore, warnings-as-errors build, every offline harness against the pinned total,
      # doc/verifier drift, the engine smoke, and the known-vulnerability gate.
      - name: Verify
        shell: pwsh
        run: ./scripts/Verify.ps1 -IncludeAudit
